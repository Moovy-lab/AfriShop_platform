[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Assertions are the standard failure mechanism in pytest test functions.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]
# isort 6 groups this PYTHONPATH-only flat module with DAG imports; Ruff I001 expects a split.
"dags/afrishop_daily_pipeline.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=60"
markers = ["integration: requires project integration data or services"]

[tool.coverage.run]
source = ["src"]
omit = ["src/curated/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
