name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install mypy pre-commit
      - run: black --check --line-length=100 dags src tests
      - run: isort --check-only --profile=black --line-length=100 dags src tests
      - run: ruff check dags src tests
      - run: mypy --config-file=pyproject.toml
      - run: pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m pip install
          "apache-airflow==2.9.3"
          --constraint
          "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
      - run: pytest -q
        env:
          PII_HASH_SALT: ci-test-salt
          DATA_DIR: data
          PYSPARK_SUBMIT_ARGS: --packages io.delta:delta-spark_2.12:3.2.1 pyspark-shell

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install "dbt-core~=1.8.0" "dbt-postgres~=1.8.0"
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          WAREHOUSE_DB_HOST: localhost
          WAREHOUSE_DB_PORT: "5432"
          WAREHOUSE_DB_NAME: afrishop_ci
          WAREHOUSE_DB_USER: afrishop_ci
          WAREHOUSE_DB_PASSWORD: afrishop_ci

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose config --quiet
