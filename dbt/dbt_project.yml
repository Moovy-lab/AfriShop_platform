name: afrishop
version: "1.0.0"
config-version: 2
profile: afrishop

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["data_tests"]
clean-targets: ["target", "dbt_packages"]

models:
  afrishop:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts