version: 2

models:
  - name: fact_order_line
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
              config:
                severity: warn
      - name: product_key
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
              config:
                severity: warn
      - name: order_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]

  - name: dim_payment_method
    columns:
      - name: payment_method
        data_tests: [unique, not_null]

  - name: dim_delivery_status
    columns:
      - name: delivery_status
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: agg_customer_rfm
    columns:
      - name: customer_id
        data_data_tests: [ not_null ]
      - name: currency
        data_data_tests: [ not_null ]
